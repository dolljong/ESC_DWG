<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXF Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        html, body { height: 100%; }

        /* ── Toolbar ─────────────────────────────────── */
        #toolbar {
            height: 48px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            z-index: 10;
            border-bottom: 1px solid #444;
        }
        #toolbar label {
            cursor: pointer;
            padding: 6px 16px;
            background: #4a9eff;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        #toolbar label:hover { background: #3a8eef; }
        #toolbar button {
            cursor: pointer;
            padding: 6px 16px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        #toolbar button:hover { background: #43A047; }
        #toolbar button.toggle-btn {
            background: #666;
        }
        #toolbar button.toggle-btn:hover { background: #777; }
        #toolbar button.toggle-btn.active {
            background: #ff9800;
        }
        #toolbar button.toggle-btn.active:hover { background: #fb8c00; }
        #fileInput { display: none; }
        #fileName { font-size: 14px; color: #aaa; }
        #status { font-size: 13px; color: #888; margin-left: auto; }

        /* ── Content area ────────────────────────────── */
        #content-area {
            display: flex;
            height: calc(100vh - 48px);
        }

        /* ── Script panel ────────────────────────────── */
        #script-panel {
            width: 380px;
            min-width: 380px;
            background: #252525;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            display: none;          /* hidden by default */
        }
        #script-panel.visible {
            display: flex;
        }
        #script-panel h3 {
            padding: 10px 12px 6px;
            font-size: 14px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }
        #script-editor {
            flex: 1;
            min-height: 120px;
            margin: 8px;
            padding: 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            tab-size: 4;
        }
        #script-editor:focus { outline: 1px solid #4a9eff; }
        #script-actions {
            display: flex;
            gap: 8px;
            padding: 0 8px 8px;
        }
        #run-script-btn {
            flex: 1;
            padding: 8px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        #run-script-btn:hover { background: #43A047; }
        #script-errors {
            max-height: 120px;
            overflow-y: auto;
            margin: 0 8px 8px;
            padding: 6px 8px;
            background: #3a1c1c;
            border: 1px solid #6b2c2c;
            border-radius: 4px;
            font-size: 12px;
            color: #ff8a80;
            white-space: pre-wrap;
            display: none;          /* hidden when no errors */
        }

        /* ── Chat panel ──────────────────────────────── */
        #chat-section {
            display: flex;
            flex-direction: column;
            height: 45%;
            min-height: 200px;
            border-top: 1px solid #444;
        }
        #model-row {
            padding: 0 8px 6px;
            font-size: 11.5px;
            color: #777;
        }
        #chat-log {
            flex: 1;
            min-height: 0;          /* allow the flex child to scroll */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0 8px 6px;
            font-size: 12.5px;
        }
        .chat-msg {
            padding: 6px 8px;
            border-radius: 4px;
            white-space: pre-wrap;
            line-height: 1.45;
        }
        .chat-msg.user {
            background: #2f4f7f;
            color: #e8f0ff;
            align-self: flex-end;
            max-width: 90%;
        }
        .chat-msg.assistant { background: #2d3d2d; color: #cfe8cf; }
        .chat-msg.status { padding: 2px 8px; color: #999; font-style: italic; }
        .chat-msg.error {
            background: #3a1c1c;
            border: 1px solid #6b2c2c;
            color: #ff8a80;
        }
        #chat-input-row {
            display: flex;
            gap: 6px;
            padding: 0 8px 8px;
        }
        #chat-input {
            flex: 1;
            resize: none;
            padding: 6px 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12.5px;
        }
        #chat-input:focus { outline: 1px solid #4a9eff; }
        #chat-send {
            padding: 0 14px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        #chat-send:hover { background: #3a8eef; }
        #chat-send:disabled { background: #555; cursor: default; }

        /* ── Viewer ──────────────────────────────────── */
        #viewer {
            flex: 1;
            min-width: 0;
        }

        /* ── Help dialog ─────────────────────────────── */
        #help-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;              /* toggled to flex when open */
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
        }
        #help-overlay.visible { display: flex; }
        #help-dialog {
            display: flex;
            flex-direction: column;
            width: min(760px, 100%);
            max-height: 100%;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #help-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #3a3a3a;
        }
        #help-header h3 { font-size: 15px; color: #eee; }
        #help-close {
            margin-left: auto;
            cursor: pointer;
            padding: 4px 12px;
            background: #666;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        #help-close:hover { background: #777; }
        #help-body {
            overflow-y: auto;
            padding: 4px 20px 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #ccc;
        }
        #help-body section { margin-top: 18px; }
        #help-body h4 {
            font-size: 14px;
            color: #4a9eff;
            padding-bottom: 4px;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        #help-body p { margin: 6px 0; }
        #help-body ul { margin: 6px 0 6px 20px; }
        #help-body li { margin: 3px 0; }
        #help-body dt { margin-top: 12px; }
        #help-body dd { margin: 4px 0 0 14px; color: #aaa; }
        #help-body b { color: #e6e6e6; }
        #help-body code {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12.5px;
            color: #d7ba7d;
        }
        #help-body dt code { font-size: 13px; color: #9cdcfe; }
        #help-body pre {
            margin: 6px 0;
            padding: 8px 10px;
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            overflow-x: auto;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12.5px;
            line-height: 1.5;
            color: #d4d4d4;
        }
        #help-body .note { color: #999; font-size: 12.5px; }
        #help-body .alias { color: #888; font-size: 12px; font-weight: normal; }
        #help-body .ok  { color: #6a9955; }
        #help-body .bad { color: #ff8a80; }
    </style>
</head>
<body>
    <div id="toolbar">
        <label for="fileInput">Open DXF</label>
        <input type="file" id="fileInput" accept=".dxf">
        <button id="loadExample">Load Example</button>
        <button id="toggleScript" class="toggle-btn">Script</button>
        <button id="showHelp" class="toggle-btn">도움말</button>
        <span id="fileName">No file loaded</span>
        <span id="status"></span>
    </div>

    <div id="content-area">
        <div id="script-panel">
            <h3>Script Editor</h3>
            <textarea id="script-editor" spellcheck="false"># Variables
H = 1000
B = 2000

# Points: name = x_expr, y_expr
p1 = 0, 0
p2 = p1.x+B, p1.y
p3 = p2.x, p2.y+H
p4 = p1.x, p1.y+H
pc = B/2, H/2

# Entities (use point names or (expr,expr))
rect p1 p3
line p1 p3
line p2 p4
circle pc H/4

# text &lt;pt&gt; [align] height "content"
# align: L,C,R + B,M,T (ex: LB, CT, R)
text p1 LT 50 "p1(LB)"
text p3 RB 50 "p3(RT)"
text pc CM 80 "CENTER"
</textarea>
            <div id="script-actions">
                <button id="run-script-btn">Run Script</button>
            </div>
            <div id="script-errors"></div>

            <div id="chat-section">
                <h3>AI Assistant</h3>
                <div id="model-row">
                    <span id="model-label"></span>
                </div>
                <div id="chat-log"></div>
                <div id="chat-input-row">
                    <textarea id="chat-input" rows="2" spellcheck="false"
                              placeholder="예: 가로 2000 세로 1000 사각형에 대각선과 중앙 원"></textarea>
                    <button id="chat-send">Send</button>
                </div>
            </div>
        </div>

        <div id="viewer"></div>
    </div>

    <!-- Script reference; body is filled in from src/script-help.js -->
    <div id="help-overlay">
        <div id="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
            <div id="help-header">
                <h3 id="help-title">스크립트 사용법</h3>
                <button id="help-close">닫기</button>
            </div>
            <div id="help-body"></div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
