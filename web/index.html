<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXF Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
        html, body { height: 100%; }

        /* ── Toolbar ─────────────────────────────────── */
        #toolbar {
            height: 48px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            z-index: 10;
            border-bottom: 1px solid #444;
        }
        #toolbar label {
            cursor: pointer;
            padding: 6px 16px;
            background: #4a9eff;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        #toolbar label:hover { background: #3a8eef; }
        #toolbar button {
            cursor: pointer;
            padding: 6px 16px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        #toolbar button:hover { background: #43A047; }
        #toolbar button.toggle-btn {
            background: #666;
        }
        #toolbar button.toggle-btn:hover { background: #777; }
        #toolbar button.toggle-btn.active {
            background: #ff9800;
        }
        #toolbar button.toggle-btn.active:hover { background: #fb8c00; }
        #fileInput { display: none; }
        #fileName { font-size: 14px; color: #aaa; }
        #status { font-size: 13px; color: #888; margin-left: auto; }

        /* ── Content area ────────────────────────────── */
        #content-area {
            display: flex;
            height: calc(100vh - 48px);
        }

        /* ── Script panel ────────────────────────────── */
        #script-panel {
            width: 380px;
            min-width: 380px;
            background: #252525;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            display: none;          /* hidden by default */
        }
        #script-panel.visible {
            display: flex;
        }
        #script-panel h3 {
            padding: 10px 12px 6px;
            font-size: 14px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }
        #script-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 8px 6px 12px;
            border-bottom: 1px solid #333;
        }
        #script-header h3 {
            padding: 0;
            border: none;
            flex: 1;
        }
        #example-select {
            max-width: 190px;
            padding: 4px 6px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        #example-select:hover { border-color: #4a9eff; }
        #example-select:focus { outline: 1px solid #4a9eff; }
        #script-editor {
            flex: 1;
            min-height: 120px;
            margin: 8px;
            padding: 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            tab-size: 4;
        }
        #script-editor:focus { outline: 1px solid #4a9eff; }
        #script-actions {
            display: flex;
            gap: 8px;
            padding: 0 8px 8px;
        }
        #run-script-btn {
            flex: 1;
            padding: 8px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        #run-script-btn:hover { background: #43A047; }
        #save-dxf-btn {
            padding: 8px 14px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        #save-dxf-btn:hover { background: #3a8eef; }
        #show-points-btn {
            padding: 8px 12px;
            background: #666;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        #show-points-btn:hover { background: #777; }
        #show-points-btn.active { background: #e53935; }
        #show-points-btn.active:hover { background: #d32f2f; }
        #dim-settings-btn {
            padding: 8px 12px;
            background: #666;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        #dim-settings-btn:hover { background: #777; }
        #dim-settings-btn.active { background: #ff9800; }
        #dim-settings-btn.active:hover { background: #fb8c00; }
        #script-errors {
            max-height: 120px;
            overflow-y: auto;
            margin: 0 8px 8px;
            padding: 6px 8px;
            background: #3a1c1c;
            border: 1px solid #6b2c2c;
            border-radius: 4px;
            font-size: 12px;
            color: #ff8a80;
            white-space: pre-wrap;
            display: none;          /* hidden when no errors */
        }

        /* ── Chat panel ──────────────────────────────── */
        #chat-section {
            display: flex;
            flex-direction: column;
            height: 45%;
            min-height: 200px;
            border-top: 1px solid #444;
        }
        #model-row {
            padding: 0 8px 6px;
            font-size: 11.5px;
            color: #777;
        }
        #chat-log {
            flex: 1;
            min-height: 0;          /* allow the flex child to scroll */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 0 8px 6px;
            font-size: 12.5px;
        }
        .chat-msg {
            padding: 6px 8px;
            border-radius: 4px;
            white-space: pre-wrap;
            line-height: 1.45;
        }
        .chat-msg.user {
            background: #2f4f7f;
            color: #e8f0ff;
            align-self: flex-end;
            max-width: 90%;
        }
        .chat-msg.assistant { background: #2d3d2d; color: #cfe8cf; }
        .chat-msg.status { padding: 2px 8px; color: #999; font-style: italic; }
        .chat-msg.error {
            background: #3a1c1c;
            border: 1px solid #6b2c2c;
            color: #ff8a80;
        }
        #chat-input-row {
            display: flex;
            gap: 6px;
            padding: 0 8px 8px;
        }
        #chat-input {
            flex: 1;
            resize: none;
            padding: 6px 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #444;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12.5px;
        }
        #chat-input:focus { outline: 1px solid #4a9eff; }
        #chat-send {
            padding: 0 14px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        #chat-send:hover { background: #3a8eef; }
        #chat-send:disabled { background: #555; cursor: default; }

        /* ── Viewer ──────────────────────────────────── */
        #viewer {
            flex: 1;
            min-width: 0;
        }

        /* ── Point name overlay ──────────────────────── */
        /* Sits over the canvas; never takes the pointer, so pan and zoom still
           reach the viewer underneath. */
        #point-overlay {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        #point-overlay.visible { display: block; }
        .point-marker {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform;
        }
        .point-dot {
            position: absolute;
            width: 7px;
            height: 7px;
            margin: -3.5px 0 0 -3.5px;
            border-radius: 50%;
            background: #ff2d2d;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.75);
        }
        .point-label {
            position: absolute;
            left: 7px;
            bottom: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
            color: #ff5c5c;
            white-space: nowrap;
            /* Readable over both the dark background and white geometry. */
            text-shadow:
                -1px -1px 0 #000, 1px -1px 0 #000,
                -1px  1px 0 #000, 1px  1px 0 #000;
        }

        /* ── Help dialog ─────────────────────────────── */
        #help-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;              /* toggled to flex when open */
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
        }
        #help-overlay.visible { display: flex; }
        #help-dialog {
            display: flex;
            flex-direction: column;
            width: min(760px, 100%);
            max-height: 100%;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #help-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #3a3a3a;
        }
        #help-header h3 { font-size: 15px; color: #eee; }
        #help-close {
            margin-left: auto;
            cursor: pointer;
            padding: 4px 12px;
            background: #666;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        #help-close:hover { background: #777; }
        #help-body {
            overflow-y: auto;
            padding: 4px 20px 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #ccc;
        }
        #help-body section { margin-top: 18px; }
        #help-body h4 {
            font-size: 14px;
            color: #4a9eff;
            padding-bottom: 4px;
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        #help-body p { margin: 6px 0; }
        #help-body ul { margin: 6px 0 6px 20px; }
        #help-body li { margin: 3px 0; }
        #help-body dt { margin-top: 12px; }
        #help-body dd { margin: 4px 0 0 14px; color: #aaa; }
        #help-body b { color: #e6e6e6; }
        #help-body code {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12.5px;
            color: #d7ba7d;
        }
        #help-body dt code { font-size: 13px; color: #9cdcfe; }
        #help-body pre {
            margin: 6px 0;
            padding: 8px 10px;
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            overflow-x: auto;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12.5px;
            line-height: 1.5;
            color: #d4d4d4;
        }
        #help-body .note { color: #999; font-size: 12.5px; }
        #help-body .alias { color: #888; font-size: 12px; font-weight: normal; }
        #help-body .ok  { color: #6a9955; }
        #help-body .bad { color: #ff8a80; }

        /* ── Dimension settings dialog ───────────────── */
        #dim-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;              /* toggled to flex when open */
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
        }
        #dim-overlay.visible { display: flex; }
        #dim-dialog {
            display: flex;
            flex-direction: column;
            width: min(460px, 100%);
            max-height: 100%;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        #dim-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #3a3a3a;
        }
        #dim-header h3 { font-size: 15px; color: #eee; }
        #dim-close {
            margin-left: auto;
            cursor: pointer;
            padding: 4px 12px;
            background: #666;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }
        #dim-close:hover { background: #777; }
        #dim-body {
            overflow-y: auto;
            padding: 12px 16px 4px;
            font-size: 13px;
            color: #ccc;
        }
        .dim-note {
            margin-bottom: 12px;
            padding: 7px 9px;
            background: #1e1e1e;
            border-left: 3px solid #4a9eff;
            border-radius: 3px;
            font-size: 12px;
            line-height: 1.55;
            color: #999;
        }
        .dim-note b { color: #ccc; }
        .dim-row {
            display: grid;
            grid-template-columns: 130px 150px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 9px;
        }
        .dim-row > span:first-child { color: #ccc; }
        .dim-row em {
            font-style: normal;
            font-size: 11.5px;
            color: #777;
        }
        .dim-row input[type="number"], .dim-row select {
            width: 100%;
            padding: 5px 7px;
            background: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #555;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
        }
        .dim-row input:focus, .dim-row select:focus { outline: 1px solid #4a9eff; }
        .dim-row input:disabled { color: #666; background: #232323; }
        .dim-sub { margin-top: -4px; font-size: 12px; color: #999; }
        .dim-sub input { margin-right: 5px; vertical-align: -1px; }
        .dim-swatches {
            grid-column: 2 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .dim-swatch {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid #666;
            border-radius: 3px;
            cursor: pointer;
        }
        .dim-swatch:hover { border-color: #aaa; }
        .dim-swatch.selected {
            border-color: #4a9eff;
            box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.5);
        }
        /* BYLAYER has no colour of its own; show it as a labelled chip. */
        .dim-swatch.bylayer {
            width: auto;
            padding: 0 8px;
            background: #333;
            color: #ccc;
            font-size: 11px;
        }
        #dim-actions {
            display: flex;
            justify-content: flex-end;
            padding: 8px 16px 12px;
        }
        #dim-reset {
            cursor: pointer;
            padding: 6px 12px;
            background: #444;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 12.5px;
        }
        #dim-reset:hover { background: #4f4f4f; }
    </style>
</head>
<body>
    <div id="toolbar">
        <label for="fileInput">Open DXF</label>
        <input type="file" id="fileInput" accept=".dxf">
        <button id="loadExample">Load Example</button>
        <button id="toggleScript" class="toggle-btn">Script</button>
        <button id="showHelp" class="toggle-btn">도움말</button>
        <span id="fileName">No file loaded</span>
        <span id="status"></span>
    </div>

    <div id="content-area">
        <div id="script-panel">
            <div id="script-header">
                <h3>Script Editor</h3>
                <!-- Options and initial content come from src/script-examples.js -->
                <select id="example-select" title="예제 스크립트 불러오기"></select>
            </div>
            <textarea id="script-editor" spellcheck="false"></textarea>
            <div id="script-actions">
                <button id="run-script-btn">Run Script</button>
                <button id="show-points-btn" class="toggle-btn"
                        title="스크립트에 정의된 점 위치와 이름을 도면 위에 표시">점 이름</button>
                <button id="dim-settings-btn" title="치수선 색·화살표·크기·배율 설정">치수 설정</button>
                <button id="save-dxf-btn" title="현재 스크립트를 DXF 파일로 내려받기">DXF 저장</button>
            </div>
            <div id="script-errors"></div>

            <div id="chat-section">
                <h3>AI Assistant</h3>
                <div id="model-row">
                    <span id="model-label"></span>
                </div>
                <div id="chat-log"></div>
                <div id="chat-input-row">
                    <textarea id="chat-input" rows="2" spellcheck="false"
                              placeholder="예: 가로 2000 세로 1000 사각형에 대각선과 중앙 원"></textarea>
                    <button id="chat-send">Send</button>
                </div>
            </div>
        </div>

        <div id="viewer"></div>
    </div>

    <!-- Dimension appearance; wired up in src/dim-settings.js -->
    <div id="dim-overlay">
        <div id="dim-dialog" role="dialog" aria-modal="true" aria-labelledby="dim-title">
            <div id="dim-header">
                <h3 id="dim-title">치수선 설정</h3>
                <button id="dim-close">닫기</button>
            </div>
            <div id="dim-body">
                <p class="dim-note">
                    크기 값은 <b>도면 배율(DIMSCALE)을 곱하기 전</b>의 값입니다.
                    배율만 바꾸면 치수 전체가 같은 비율로 커지고 작아집니다.
                </p>

                <label class="dim-row">
                    <span>치수선 색</span>
                    <span id="dim-color" class="dim-swatches"></span>
                </label>

                <label class="dim-row">
                    <span>문자 색</span>
                    <span id="dim-text-color" class="dim-swatches"></span>
                </label>

                <label class="dim-row">
                    <span>치수선 모양</span>
                    <select id="dim-arrow">
                        <option value="closed">채운 화살표</option>
                        <option value="dot">점 (도트)</option>
                        <option value="tick">사선 틱 (건축)</option>
                        <option value="none">없음</option>
                    </select>
                </label>

                <label class="dim-row">
                    <span>화살표 · 점 · 틱 크기</span>
                    <input id="dim-arrow-size" type="number" min="0" step="0.25">
                </label>

                <label class="dim-row">
                    <span>보조선 시작 옵셋</span>
                    <input id="dim-ext-offset" type="number" min="0" step="0.125">
                    <em>원점에서 띄우는 거리 (DIMEXO)</em>
                </label>

                <label class="dim-row">
                    <span>치수선 너머 연장</span>
                    <input id="dim-ext-beyond" type="number" min="0" step="0.125">
                    <em>보조선이 치수선을 지나 뻗는 길이 (DIMEXE)</em>
                </label>

                <label class="dim-row">
                    <span>문자 크기</span>
                    <input id="dim-text-height" type="number" min="0.1" step="0.25">
                    <em>DIMTXT</em>
                </label>

                <label class="dim-row">
                    <span>도면 배율</span>
                    <input id="dim-scale" type="number" min="0.001" step="0.5">
                    <em id="dim-scale-note"></em>
                </label>
                <label class="dim-row dim-sub">
                    <span></span>
                    <span><input id="dim-scale-auto" type="checkbox"> 자동 (도면 크기에 맞춤)</span>
                </label>
            </div>
            <div id="dim-actions">
                <button id="dim-reset">기본값으로</button>
            </div>
        </div>
    </div>

    <!-- Script reference; body is filled in from src/script-help.js -->
    <div id="help-overlay">
        <div id="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title">
            <div id="help-header">
                <h3 id="help-title">스크립트 사용법</h3>
                <button id="help-close">닫기</button>
            </div>
            <div id="help-body"></div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
